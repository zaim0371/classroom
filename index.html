<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Zaim’s Classroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--tx:#10162b;--tx2:rgba(16,22,43,.62);--gl:rgba(255,255,255,.34);--gl2:rgba(255,255,255,.55);--bd:rgba(255,255,255,.7);--sh:rgba(60,70,100,.14);--bg1:#e8edf5;--bg2:#f5f3f0;--ok:#1fa968;--no:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#f4f6ff;--tx2:rgba(244,246,255,.62);--gl:rgba(255,255,255,.09);--gl2:rgba(255,255,255,.17);--bd:rgba(255,255,255,.24);--sh:rgba(0,0,0,.5);--bg1:#1d2635;--bg2:#2a3140;color-scheme:dark}}
:root[data-theme="dark"]{--tx:#f4f6ff;--tx2:rgba(244,246,255,.62);--gl:rgba(255,255,255,.09);--gl2:rgba(255,255,255,.17);--bd:rgba(255,255,255,.24);--sh:rgba(0,0,0,.5);--bg1:#1d2635;--bg2:#2a3140;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;filter:saturate(.75)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;will-change:transform;animation:fl 16s ease-in-out infinite alternate}
.o1{width:52vmax;height:52vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle at 35% 35%,#a9c4f5,#8fb0ea 60%,transparent 72%)}
.o2{width:44vmax;height:44vmax;right:-14vmax;top:18vh;background:radial-gradient(circle at 40% 40%,#d9cfe9,#c4b9dc 60%,transparent 72%);animation-duration:20s;animation-delay:-6s}
.o3{width:40vmax;height:40vmax;left:8vw;bottom:-16vmax;background:radial-gradient(circle at 40% 40%,#b5dfd8,#9cd0d6 60%,transparent 72%);animation-duration:23s;animation-delay:-11s}
@keyframes fl{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,6vh,0) scale(1.12)}100%{transform:translate3d(-6vw,-5vh,0) scale(.94)}}
.glass{position:relative;background:linear-gradient(135deg,var(--gl2),var(--gl) 45%,var(--gl));-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.06);backdrop-filter:blur(26px) saturate(190%) brightness(1.06);border:1px solid var(--bd);border-radius:26px;box-shadow:0 12px 34px var(--sh),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.15),inset 0 0 22px rgba(255,255,255,.1);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.42),transparent 60%);opacity:.7;transition:opacity .3s}
.glass::after{content:"";position:absolute;left:10%;right:10%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none}
.app{position:relative;z-index:1;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:14px 14px 0}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:10px;animation:rise .8s cubic-bezier(.2,.9,.25,1) both}
.logo{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;color:#fff;font-weight:700;background:linear-gradient(180deg,#5e90f0,#3f73e0);box-shadow:inset 0 1.5px 2px rgba(255,255,255,.6),0 5px 12px rgba(63,115,224,.3)}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
header p{margin:1px 0 0;font-size:12.5px;color:var(--tx2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;animation:rise .9s .1s cubic-bezier(.2,.9,.25,1) both}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--gl);color:var(--tx);padding:8px 15px;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .3s}
.chip:active{transform:scale(.92)}
.chip.on{background:linear-gradient(180deg,#5e90f0,#3f73e0);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 5px 12px rgba(63,115,224,.3),inset 0 1px 0 rgba(255,255,255,.7)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(18px) scale(.98);pointer-events:none;transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.25,1)}
.view.show{opacity:1;transform:none;pointer-events:auto}
.scroll{flex:1;overflow-y:auto;padding:4px 2px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msg{max-width:86%;padding:12px 16px;border-radius:22px;font-size:15px;line-height:1.5;word-wrap:break-word;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.msg.u{align-self:flex-end;background:linear-gradient(180deg,#5e90f0,#3f73e0);color:#fff;border-bottom-right-radius:8px;box-shadow:0 6px 14px rgba(63,115,224,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.msg.a{align-self:flex-start;border-bottom-left-radius:8px}
.msg code{background:rgba(120,120,160,.25);padding:1px 6px;border-radius:6px;font-size:13px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--tx2);animation:bn 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}}
@keyframes rise{from{opacity:0;transform:translateY(-16px) scale(.96)}}
.hero{margin:auto;text-align:center;padding:26px 22px;max-width:340px;animation:pop .8s both}
.hero b{font-size:22px;display:block;margin-bottom:6px}.hero span{color:var(--tx2);font-size:14px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.composer{display:flex;gap:8px;align-items:center;padding:7px 7px 7px 18px;border-radius:99px;margin-bottom:10px}
.composer input,.qin{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:16px inherit;font-family:inherit}
::placeholder{color:var(--tx2)}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:18px;background:linear-gradient(180deg,#5e90f0,#3f73e0);box-shadow:0 5px 12px rgba(63,115,224,.3),inset 0 1.5px 0 rgba(255,255,255,.7);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.send:active{transform:scale(.85)}.send:disabled{opacity:.5}
.q{padding:18px;margin-bottom:12px;animation:pop .6s both}
.q h3{margin:0 0 12px;font-size:16px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:15px inherit;font-family:inherit;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s}
.opt:active{transform:scale(.97)}
.opt.ok{background:rgba(31,169,104,.5);border-color:#3ddc97}.opt.no{background:rgba(229,72,77,.5);border-color:#ff7b80;animation:sk .4s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{margin-top:10px;font-size:13.5px;color:var(--tx2);line-height:1.45}
.score{text-align:center;font-weight:700;padding:10px;color:var(--tx)}
.tabbar{position:relative;display:flex;padding:6px;border-radius:99px;margin:4px auto 12px;width:min(340px,100%)}
.tabbar button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--tx2);font:600 13.5px inherit;font-family:inherit;padding:11px 0;cursor:pointer;transition:color .3s}
.tabbar button.on{color:var(--tx)}
.pill{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:99px;background:var(--gl2);border:1px solid var(--bd);box-shadow:0 4px 12px var(--sh),inset 0 1.5px 0 rgba(255,255,255,.8);transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.note{font-size:12.5px;color:var(--tx2);text-align:center;padding:6px}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(30,40,60,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s}
.modal.show{opacity:1;pointer-events:auto}
.card{width:min(400px,100%);padding:22px;transform:scale(.94) translateY(12px);transition:transform .55s cubic-bezier(.2,1.3,.4,1)}
.modal.show .card{transform:none}
.card h2{margin:0 0 6px;font-size:19px}
.card p{margin:0 0 14px;font-size:13.5px;color:var(--tx2);line-height:1.5}
.card input{width:100%;margin-bottom:10px;padding:13px 15px;border-radius:16px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:15px inherit;font-family:inherit;outline:0}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.gear{margin-left:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<div class="app">
  <header class="glass"><div class="logo">Z</div><div><h1>Zaim’s Classroom</h1><p>Belajar bareng AI, kapan saja</p></div><button class="chip gear" id="gear" type="button">API Key</button></header>
  <div class="chips" id="chips"></div>
  <main>
    <section class="view show" id="v0">
      <div class="scroll" id="log"></div>
      <form class="composer glass" id="f" onsubmit="return false"><input id="in" placeholder="Tanya apa saja soal pelajaran…" autocomplete="off"><button class="send" id="sb" type="button" aria-label="Kirim">↑</button></form>
    </section>
    <section class="view" id="v1">
      <form class="composer glass" onsubmit="return false"><input class="qin" id="topic" placeholder="Topik kuis, mis. Pecahan, Fotosintesis…"><button class="send" id="qb" type="button" aria-label="Buat kuis">→</button></form>
      <div class="scroll" id="quiz"><div class="hero glass"><b>Uji pemahamanmu</b><span>Ketik topik, AI akan membuat 5 soal pilihan ganda.</span></div></div>
    </section>
  </main>
  <nav class="tabbar glass"><i class="pill" id="pill"></i><button class="on" data-t="0">Belajar</button><button data-t="1">Kuis</button></nav>
</div>
<div class="modal" id="modal"><div class="glass card"><h2>Hubungkan Google AI</h2><p>Cukup masukkan API key Gemini dari aistudio.google.com/apikey. Model dipilih otomatis. Key hanya disimpan di browser ini dan dikirim langsung ke Google.</p><input id="kin" type="password" placeholder="AIza…" autocomplete="off"><div class="note" id="kerr"></div><div class="row"><button class="chip" id="kclear" type="button">Hapus key</button><button class="chip" id="kclose" type="button">Tutup</button><button class="chip on" id="ksave" type="button">Simpan &amp; mulai</button></div></div></div>
<script>
let CATS=[];try{CATS=JSON.parse(localStorage.getItem("zc-cats")||"[]")}catch(e){}
const $=s=>document.getElementById(s);
let subj="Umum",hist=[],sample=null,busy=false;
function save(){try{localStorage.setItem("zc-cats",JSON.stringify(CATS))}catch(e){}}
function pick(s){subj=s;hist=[];renderChips();showHero()}
function renderChips(){const w=$("chips");w.innerHTML="";
  ["Umum",...CATS].forEach(s=>{const b=document.createElement("button");b.className="chip"+(s===subj?" on":"");b.textContent=s;
    if(s===subj&&s!=="Umum"){const x=document.createElement("span");x.textContent=" ×";x.setAttribute("aria-label","Hapus kategori");x.onclick=e=>{e.stopPropagation();CATS=CATS.filter(c=>c!==s);save();pick("Umum")};b.appendChild(x)}
    b.onclick=()=>pick(s);w.appendChild(b)});
  const a=document.createElement("button");a.className="chip";a.textContent="+ Kategori";
  a.onclick=()=>{const i=document.createElement("input");i.className="chip";i.placeholder="Nama kategori";i.maxLength=24;i.style.cssText="width:150px;outline:0";a.replaceWith(i);i.focus();i.onblur=renderChips;
    i.onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();i.onblur=null;const n=i.value.trim();if(n&&n!=="Umum"&&!CATS.includes(n)){CATS.push(n);save();pick(n)}else renderChips()}};
  w.appendChild(a);w.scrollTo({left:w.scrollWidth,behavior:"smooth"})}
renderChips();
// light follows pointer on glass surfaces
document.addEventListener("pointermove",e=>{const g=e.target.closest&&e.target.closest(".glass");if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty("--mx",(e.clientX-r.left)+"px");g.style.setProperty("--my",(e.clientY-r.top)+"px")});
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{const t=+b.dataset.t;document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("on",x===b));$("pill").style.transform="translateX("+(t*100)+"%)";$("v0").classList.toggle("show",t===0);$("v1").classList.toggle("show",t===1)});
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){return esc(s).replace(/```[a-z]*\n?([\s\S]*?)```/g,"<code style='display:block;white-space:pre-wrap;padding:10px'>$1</code>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")}
function showHero(){const l=$("log");l.innerHTML="";const h=document.createElement("div");h.className="hero glass";h.innerHTML="<b>Halo, Zaim</b><span>"+(subj==="Umum"?"Mau belajar apa hari ini? Buat kategori sendiri lewat tombol “+ Kategori”.":"Kategori: "+esc(subj)+". Mau belajar apa hari ini?")+"</span><div class='sug'></div>";["Jelaskan dengan contoh sederhana","Beri aku latihan soal","Apa itu topik favoritmu?"].slice(0,2).forEach(t=>{const c=document.createElement("button");c.className="chip";c.textContent=t;c.onclick=()=>{$("in").value=t;send()};h.querySelector(".sug").appendChild(c)});l.appendChild(h)}
showHero();
function add(cls,html){const l=$("log");const h=l.querySelector(".hero");if(h)h.remove();const d=document.createElement("div");d.className="msg "+cls+(cls==="a"?" glass":"");d.innerHTML=html;l.appendChild(d);l.scrollTo({top:l.scrollHeight,behavior:"smooth"});return d}
const SYS=()=>"Kamu adalah guru AI yang ramah di “Zaim’s Classroom”. Kategori belajar: "+subj+" (jika Umum, boleh topik apa saja). Jawab dalam Bahasa Indonesia, singkat, jelas, beri contoh, dan akhiri dengan satu pertanyaan pendek untuk menguji pemahaman. Pakai **tebal** seperlunya.";
let KEY="",MODEL="";
try{KEY=localStorage.getItem("zc-key")||"";MODEL=localStorage.getItem("zc-model")||""}catch(e){}
const API="https://generativelanguage.googleapis.com/v1beta/";
// pilih model otomatis dari daftar model yang tersedia untuk key ini
async function detectModel(){
  const r=await fetch(API+"models?pageSize=200",{headers:{"x-goog-api-key":KEY}});
  if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
  const j=await r.json();
  const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>/^gemini-/.test(n)&&!/(image|tts|embed|live|audio|vision|robotics|computer|exp|preview)/.test(n));
  if(!ok.length)throw new Error("nomodel");
  const ver=n=>{const m=n.match(/^gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const tier=n=>/flash-lite/.test(n)?1:/flash/.test(n)?3:/pro/.test(n)?2:0;
  ok.sort((a,b)=>(tier(b)-tier(a))||(ver(b)-ver(a))||a.length-b.length);
  MODEL=ok[0];try{localStorage.setItem("zc-model",MODEL)}catch(e){}
  return MODEL;
}
function openSet(){$("kin").value=KEY;$("kerr").textContent="";$("kclose").style.display=KEY?"":"none";$("modal").classList.add("show");setTimeout(()=>$("kin").focus(),300)}
$("gear").onclick=openSet;
$("kclose").onclick=()=>$("modal").classList.remove("show");
$("ksave").onclick=async()=>{const k=$("kin").value.trim();if(!k){$("kerr").textContent="Masukkan API key dulu.";return}
  const b=$("ksave");b.disabled=true;$("kerr").textContent="Memeriksa key…";KEY=k;MODEL="";
  try{await detectModel();try{localStorage.setItem("zc-key",KEY)}catch(e){}$("modal").classList.remove("show");$("kerr").textContent=""}
  catch(e){KEY="";$("kerr").textContent=e.status?errMsg(e):(e.message==="nomodel"?"Tidak ada model Gemini yang bisa dipakai untuk key ini.":errMsg(e))}
  b.disabled=false};
$("kclear").onclick=()=>{KEY="";MODEL="";try{localStorage.removeItem("zc-key");localStorage.removeItem("zc-model")}catch(e){}$("kin").value="";$("kclose").style.display="none"};
if(!KEY)openSet();
function errMsg(e){const s=e&&e.status;if(s===400||s===401||s===403)return"API key tidak valid atau belum aktif. Cek lewat tombol API Key.";if(s===404)return"Model Gemini tidak tersedia untuk key ini. Coba buat API key baru di aistudio.google.com/apikey.";if(s===429)return"Kuota atau kecepatan terlampaui. Coba lagi sebentar.";return"Tidak bisa terhubung ke Google AI. Cek koneksi internetmu."}
async function gen(msgs,o={},retry){
  if(!MODEL)await detectModel();
  const url=API+"models/"+encodeURIComponent(MODEL)+(o.stream?":streamGenerateContent?alt=sse":":generateContent");
  const body={contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}))};
  if(o.sys)body.systemInstruction={parts:[{text:o.sys}]};
  if(o.json)body.generationConfig={responseMimeType:"application/json"};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify(body)});
  if(!r.ok){if(r.status===404&&!retry){MODEL="";try{localStorage.removeItem("zc-model")}catch(e){}return gen(msgs,o,true)}const e=new Error("http");e.status=r.status;throw e}
  const pk=j=>((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
  if(!o.stream)return pk(await r.json());
  const rd=r.body.getReader(),dc=new TextDecoder();let buf="",all="";
  for(;;){const x=await rd.read();if(x.done)break;buf+=dc.decode(x.value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
    for(const l of ls){if(l.startsWith("data:")){try{all+=pk(JSON.parse(l.slice(5)));o.onText&&o.onText(all)}catch(e){}}}}
  return all;
}
async function send(){
  const v=$("in").value.trim();if(!v||busy)return;
  if(!KEY){openSet();return}
  busy=true;$("sb").disabled=true;$("in").value="";add("u",esc(v));hist.push({role:"user",content:v});
  const m=add("a","<span class='dots'><span></span><span></span><span></span></span>");
  try{const t=await gen(hist,{stream:true,sys:SYS(),onText:t=>{m.innerHTML=md(t);$("log").scrollTop=$("log").scrollHeight}});
    if(!t)throw new Error("empty");m.innerHTML=md(t);hist.push({role:"assistant",content:t})}
  catch(e){m.textContent=e.status?errMsg(e):(e.message==="empty"?"AI tidak memberi jawaban. Coba ulangi pertanyaannya.":errMsg(e));hist.pop()}
  busy=false;$("sb").disabled=false;
}
$("sb").onclick=send;$("in").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send()}});
async function quiz(){
  const t=$("topic").value.trim();if(!t||busy)return;
  if(!KEY){openSet();return}
  const q=$("quiz");busy=true;$("qb").disabled=true;q.innerHTML="<div class='hero glass'><span class='dots'><span></span><span></span><span></span></span><br><span>Menyusun soal…</span></div>";
  try{
    const raw=await gen([{role:"user",content:"Buat 5 soal pilihan ganda tingkat sekolah tentang: "+t+" (kategori: "+subj+"). Bahasa Indonesia. Balas HANYA JSON array: [{\"q\":\"...\",\"options\":[\"A\",\"B\",\"C\",\"D\"],\"answer\":0,\"explain\":\"...\"}] dengan answer = indeks 0-3 jawaban benar."}],{json:true});
    const d=JSON.parse(raw.replace(/```json|```/g,"").trim());
    let sc=0,n=0;q.innerHTML="";const tot=d.length;
    const sd=document.createElement("div");sd.className="score";sd.textContent="Skor: 0/"+tot;
    d.forEach((it,i)=>{const c=document.createElement("div");c.className="q glass";c.style.animationDelay=i*90+"ms";c.innerHTML="<h3>"+(i+1)+". "+esc(it.q)+"</h3>";
      it.options.forEach((o,j)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>{if(c.dataset.d)return;c.dataset.d=1;n++;const bs=c.querySelectorAll(".opt");bs[it.answer].classList.add("ok");if(j===it.answer)sc++;else b.classList.add("no");const e=document.createElement("div");e.className="ex";e.textContent=it.explain||"";c.appendChild(e);sd.textContent="Skor: "+sc+"/"+tot+(n===tot?(sc===tot?" — sempurna!":" — semangat terus!"):"")};c.appendChild(b)});
      q.appendChild(c)});
    q.appendChild(sd);
  }catch(e){q.innerHTML="<div class='note'>"+(e.status?errMsg(e):"Gagal membuat kuis. Coba topik lain.")+"</div>"}
  busy=false;$("qb").disabled=false;
}
$("qb").onclick=quiz;$("topic").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();quiz()}});
</script>
